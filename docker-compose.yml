services:
  network-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-analytics-app
    ports:
      - "127.0.0.1:8502:8502"
    restart: unless-stopped
    
    # Security: Run as non-root (matches Dockerfile user)
    user: "1000:1000"
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Security: Drop all capabilities
    cap_drop:
      - ALL
    
    # Security: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    
    # Security: Disable privileged mode
    privileged: false
    
    # Security: Network isolation
    networks:
      - network-analytics-net
    
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  network-analytics-net:
    driver: bridge
    internal: false

